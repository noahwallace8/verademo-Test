# Workflow Name: Defines the name that appears in GitHub Actions UI
name: Snyk Security Scan (All Branches)

# Trigger Configuration: Defines when this workflow runs
on:
  # Scheduled trigger: Runs every Sunday at 8:00 AM UTC (cron format: minute hour day-of-month month day-of-week)
  schedule:
    - cron: "0 8 * * 0"
  # Manual trigger: Allows running this workflow manually from GitHub Actions UI
  workflow_dispatch:

# Permissions: Defines what GitHub token permissions this workflow needs
permissions:
  contents: read  # Only needs read access to repository contents

# Job Definition: Single job that performs all scanning operations
jobs:
  snyk-security-scan:
    runs-on: ubuntu-latest  # Uses Ubuntu runner for Linux-based scanning

    steps:
      # Step 1: Checkout repository code with full git history for all branches
      # This is required to access and checkout different branches later
      - name: Checkout code (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches (needed to access all remote branches)

      # Step 2: Set up Node.js environment
      # Node.js is required because Snyk CLI is installed via npm
      # The version set here is a default; it may be overridden per-branch if detected in project files
      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Default Node.js version, will be overridden per branch if detected in .nvmrc or package.json

      # Step 3: Install Snyk CLI globally using npm
      # This installs the Snyk command-line tool that performs all security scans
      - name: Install Snyk CLI
        id: install-snyk-cli
        run: |
          npm install -g snyk

      # Step 4: Set up Docker Buildx
      # Buildx is needed to build Docker container images from Dockerfiles for container scanning
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Main scanning step - Iterates through all active branches and performs security scans
      # This is a large bash script that handles branch discovery, dependency detection, and multiple scan types
      - name: Scan all branches
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # Authentication token for Snyk API (stored as GitHub secret)
          REPO_NAME: ${{ github.repository }}  # Repository name in format "owner/repo-name"
        run: |
          # Sub-step 5.1: Fetch all remote branches from origin
          # This ensures we have the latest information about all branches in the repository
          git fetch --all
          
          # Sub-step 5.2: Extract list of all remote branch names
          # Filters out HEAD reference, removes "origin/" prefix, trims whitespace, and sorts uniquely
          branches=$(git branch -r | grep -v HEAD | sed 's/origin\///' | sed 's/^[[:space:]]*//' | sort -u)
          
          # Sub-step 5.3: Calculate the cutoff date (30 days ago) as Unix timestamp
          # Branches with last commit older than this will be skipped as "dormant"
          CUTOFF_DATE=$(date -d "30 days ago" +%s)
          
          # Sub-step 5.4: Main loop - Process each branch one by one
          # Each iteration: checks if branch is active, checks out the branch, detects dependencies, installs tools, and runs scans
          for branch in $branches; do
            # Branch processing: Start processing this specific branch
            echo "========================================="
            echo "Checking branch: $branch"
            echo "========================================="
            
            # Get the last commit date for this branch as Unix timestamp (seconds since epoch)
            # This allows numeric comparison to determine if branch is dormant
            LAST_COMMIT_DATE=$(git log -1 --format=%ct "origin/$branch" 2>/dev/null)
            
            # Skip branch if we cannot retrieve its commit date (branch may not exist or have no commits)
            if [ -z "$LAST_COMMIT_DATE" ]; then
              echo "Skipping $branch: Unable to get commit date"
              echo ""
              continue  # Move to next branch in loop
            fi
            
            # Check if branch is dormant (last commit older than 30 days cutoff)
            # If dormant, skip scanning to save resources on inactive branches
            if [ "$LAST_COMMIT_DATE" -lt "$CUTOFF_DATE" ]; then
              LAST_COMMIT_READABLE=$(git log -1 --format=%cd --date=short "origin/$branch" 2>/dev/null)
              echo "Skipping $branch: Last commit was on $LAST_COMMIT_READABLE (dormant >30 days)"
              echo ""
              continue  # Move to next branch in loop
            fi
            
            # Branch is active (has commits within last 30 days), proceed with scanning
            # Log branch status and last commit date for visibility in workflow logs
            LAST_COMMIT_READABLE=$(git log -1 --format=%cd --date=short "origin/$branch" 2>/dev/null)
            echo "Branch $branch is active (last commit: $LAST_COMMIT_READABLE). Proceeding with scan..."
            echo ""
            
            # Checkout the branch to working directory
            # -f flag forces checkout even if there are uncommitted changes
            # If checkout fails, skip to next branch
            git checkout -f "$branch" || continue
            
            # ============================================
            # SECTION: Comprehensive Dependency Detection and Installation
            # This section detects all Snyk-supported programming languages and package managers
            # by checking for characteristic manifest files, then installs the necessary build tools
            # Detects: Node.js, Java, Python, .NET, Go, PHP, Ruby, Rust, Swift
            # ============================================
            echo "========================================="
            echo "Detecting dependencies for branch: $branch"
            echo "========================================="
            
            # Initialize boolean flags to track which language ecosystems are detected
            # These flags determine which dependencies need to be installed later
            NEEDS_NODE=false      # Node.js/JavaScript/npm/yarn/pnpm
            NEEDS_JAVA=false      # Java/Maven/Gradle/sbt
            NEEDS_PYTHON=false    # Python/pip/pipenv/poetry/conda
            NEEDS_DOTNET=false    # .NET/NuGet
            NEEDS_GO=false        # Go modules
            NEEDS_PHP=false       # PHP/Composer
            NEEDS_RUBY=false      # Ruby/Bundler/Gem
            NEEDS_RUST=false      # Rust/Cargo
            NEEDS_SWIFT=false     # Swift/Package Manager (macOS only, won't work on Linux)
            
            # Detect Node.js/JavaScript projects
            # Checks for presence of Node.js manifest files to determine if this is a JavaScript project
            if [ -f package.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ] || [ -f package-lock.json ]; then
              NEEDS_NODE=true  # Set flag to install Node.js dependencies later
              echo "✓ Detected: Node.js/JavaScript project"
              
              # Detect specific Node.js version required by the project
              # Checks multiple files in order of preference: .nvmrc, .node-version, package.json engines field
              NODE_VERSION=""
              if [ -f .nvmrc ]; then
                # .nvmrc file specifies Node.js version (may have 'v' prefix, which we remove)
                NODE_VERSION=$(cat .nvmrc | tr -d 'v' | xargs)
                echo "  Node.js version from .nvmrc: $NODE_VERSION"
              elif [ -f .node-version ]; then
                # Alternative version file format
                NODE_VERSION=$(cat .node-version | tr -d 'v' | xargs)
                echo "  Node.js version from .node-version: $NODE_VERSION"
              elif [ -f package.json ]; then
                # Try to extract from package.json engines.node field (preferred method: using jq if available)
                if command -v node &> /dev/null && command -v jq &> /dev/null; then
                  NODE_VERSION=$(jq -r '.engines.node // empty' package.json 2>/dev/null | sed 's/[^0-9.]//g' | head -c 4)
                elif grep -q '"engines"' package.json; then
                  # Fallback: use grep to extract version from engines field if jq not available
                  NODE_VERSION=$(grep -A 2 '"engines"' package.json | grep -oP '"node"\s*:\s*"[^"]*"' | grep -oP '\d+\.\d+' | head -1)
                fi
                if [ -n "$NODE_VERSION" ]; then
                  echo "  Node.js version from package.json: $NODE_VERSION"
                fi
              fi
              
              # Install/switch to the detected Node.js version if it differs from default (20)
              # Uses 'n' version manager to install specific Node.js versions
              if [ -n "$NODE_VERSION" ] && [ "$NODE_VERSION" != "20" ]; then
                echo "  Installing Node.js $NODE_VERSION..."
                # Install 'n' version manager if not already available
                if ! command -v n &> /dev/null; then
                  npm install -g n
                fi
                # Install the specific Node.js version (or warn if installation fails)
                n "$NODE_VERSION" || echo "  Warning: Could not install Node.js $NODE_VERSION, using default"
              fi
              
              # Detect which package manager is being used (yarn, pnpm, or npm)
              # Each has different lock files, so we check for those to determine the manager
              if [ -f yarn.lock ]; then
                echo "  Package manager: Yarn"
                # Install Yarn globally if not available
                if ! command -v yarn &> /dev/null; then
                  npm install -g yarn
                fi
              elif [ -f pnpm-lock.yaml ]; then
                echo "  Package manager: pnpm"
                # Install pnpm globally if not available
                if ! command -v pnpm &> /dev/null; then
                  npm install -g pnpm
                fi
              else
                # Default to npm (which should already be available with Node.js)
                echo "  Package manager: npm"
              fi
            fi
            
            # Detect Java projects (Maven, Gradle, sbt)
            # Checks for Java build tool manifest files to identify Java/Scala projects
            if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f gradlew ] || [ -f build.sbt ]; then
              NEEDS_JAVA=true  # Set flag to install Java dependencies later
              echo "✓ Detected: Java project"
              
              # Detect required Java version and distribution preference
              JAVA_VERSION=""
              JAVA_DISTRIBUTION="temurin"  # Default to Eclipse Temurin (formerly AdoptOpenJDK)
              
              if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
                echo "  Build tool: Gradle"
                # Check gradle.properties file first for Java version configuration
                if [ -f gradle.properties ]; then
                  JAVA_VERSION=$(grep -i "javaVersion\|java.version" gradle.properties | head -1 | grep -oP '\d+' | head -1)
                  if [ -n "$JAVA_VERSION" ]; then
                    echo "  Java version from gradle.properties: $JAVA_VERSION"
                  fi
                fi
                
                # Check build.gradle file for sourceCompatibility or Java toolchain settings
                # This is an alternative location where Java version might be specified
                if [ -z "$JAVA_VERSION" ] && [ -f build.gradle ]; then
                  JAVA_VERSION=$(grep -i "sourceCompatibility\|java.toolchain.languageVersion" build.gradle | head -1 | grep -oP '\d+' | head -1)
                  if [ -n "$JAVA_VERSION" ]; then
                    echo "  Java version from build.gradle: $JAVA_VERSION"
                  fi
                fi
                
                # Check for Java distribution preference (Temurin, Zulu, Amazon Corretto)
                # Different distributions may have different performance or licensing characteristics
                if [ -f gradle.properties ]; then
                  if grep -qi "adopt\|adoptium\|temurin" gradle.properties; then
                    JAVA_DISTRIBUTION="temurin"  # Eclipse Temurin
                  elif grep -qi "zulu" gradle.properties; then
                    JAVA_DISTRIBUTION="zulu"  # Azul Zulu
                  elif grep -qi "amazon" gradle.properties; then
                    JAVA_DISTRIBUTION="amazon"  # Amazon Corretto
                  fi
                fi
                
                # Make Gradle wrapper executable if it exists
                # gradlew is a shell script that wraps Gradle, needs execute permissions
                if [ -f gradlew ]; then
                  chmod +x gradlew
                  echo "  Made gradlew executable"
                fi
              elif [ -f pom.xml ]; then
                echo "  Build tool: Maven"
                # Extract Java version from Maven POM file (maven.compiler.source or java.version properties)
                JAVA_VERSION=$(grep -i "<maven.compiler.source\|<java.version>" pom.xml | head -1 | grep -oP '\d+' | head -1)
                if [ -n "$JAVA_VERSION" ]; then
                  echo "  Java version from pom.xml: $JAVA_VERSION"
                fi
              elif [ -f build.sbt ]; then
                echo "  Build tool: sbt (Scala)"
                # Extract Java version from sbt build file
                JAVA_VERSION=$(grep -i "javaVersion\|scalaVersion" build.sbt | head -1 | grep -oP '\d+' | head -1)
                if [ -n "$JAVA_VERSION" ]; then
                  echo "  Java version from build.sbt: $JAVA_VERSION"
                fi
              fi
              
              # Install the specific Java version if detected and not already installed
              if [ -n "$JAVA_VERSION" ]; then
                echo "  Installing Java $JAVA_VERSION ($JAVA_DISTRIBUTION)..."
                # In GitHub Actions environment, try to use SDKMAN to install Java
                # SDKMAN is a tool for managing multiple SDK versions
                if [ -n "$GITHUB_ACTIONS" ]; then
                  # Check if Java is already installed with the correct version
                  CURRENT_JAVA=$(java -version 2>&1 | head -1 | grep -oP 'version "(\d+)' | grep -oP '\d+' || echo "")
                  if [ "$CURRENT_JAVA" != "$JAVA_VERSION" ]; then
                    echo "  Java $JAVA_VERSION needed but not available. Installing via SDKMAN..."
                    # Install SDKMAN package manager
                    curl -s "https://get.sdkman.io" | bash || true
                    source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
                    # Install the specific Java version using SDKMAN
                    if command -v sdk &> /dev/null; then
                      # Try two different version formats: X.0-tem and X.0.0-tem
                      sdk install java "${JAVA_VERSION}.0-tem" || sdk install java "${JAVA_VERSION}.0.0-tem" || echo "  Warning: Could not install Java $JAVA_VERSION"
                    fi
                  fi
                fi
              fi
            fi
            
            # Detect Python projects
            # Checks for Python dependency manifest files to identify Python projects
            if [ -f requirements.txt ] || [ -f Pipfile ] || [ -f poetry.lock ] || [ -f pyproject.toml ] || [ -f setup.py ] || [ -f environment.yml ] || [ -f conda.yml ]; then
              NEEDS_PYTHON=true  # Set flag to install Python dependencies later
              echo "✓ Detected: Python project"
              
              # Detect required Python version from various configuration files
              PYTHON_VERSION=""
              if [ -f .python-version ]; then
                # pyenv version file (most explicit)
                PYTHON_VERSION=$(cat .python-version | xargs)
                echo "  Python version from .python-version: $PYTHON_VERSION"
              elif [ -f runtime.txt ]; then
                # Heroku/Cloud Foundry runtime specification
                PYTHON_VERSION=$(grep -i python runtime.txt | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PYTHON_VERSION" ]; then
                  echo "  Python version from runtime.txt: $PYTHON_VERSION"
                fi
              elif [ -f pyproject.toml ]; then
                # Modern Python project configuration (Poetry, setuptools, etc.)
                PYTHON_VERSION=$(grep -i "requires-python\|python_version" pyproject.toml | head -1 | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PYTHON_VERSION" ]; then
                  echo "  Python version from pyproject.toml: $PYTHON_VERSION"
                fi
              fi
              
              # Install the specific Python version if detected
              # Uses apt-get to install Python from Ubuntu repositories
              if [ -n "$PYTHON_VERSION" ]; then
                echo "  Installing Python $PYTHON_VERSION..."
                # Update package list and install Python version with development headers and venv support
                sudo apt-get update -qq || true
                sudo apt-get install -y "python${PYTHON_VERSION}" "python${PYTHON_VERSION}-dev" "python${PYTHON_VERSION}-venv" || echo "  Warning: Could not install Python $PYTHON_VERSION"
              fi
              
              # Detect which Python package manager is being used
              # Different managers use different lock/configuration files
              if [ -f Pipfile ]; then
                echo "  Package manager: pipenv"
                # Install pipenv if not available (Python package management tool)
                if ! command -v pipenv &> /dev/null; then
                  pip install pipenv || true
                fi
              elif [ -f poetry.lock ] || [ -f pyproject.toml ]; then
                echo "  Package manager: poetry"
                # Install Poetry if not available (modern Python dependency management)
                if ! command -v poetry &> /dev/null; then
                  pip install poetry || true
                fi
              elif [ -f environment.yml ] || [ -f conda.yml ]; then
                echo "  Package manager: conda"
                # Conda requires separate installation (not installed here)
                if ! command -v conda &> /dev/null; then
                  echo "  Warning: Conda not available, install manually if needed"
                fi
              else
                # Default to pip (should be available with Python installation)
                echo "  Package manager: pip"
              fi
            fi
            
            # Detect .NET projects (C#, F#, VB.NET)
            # Searches for .NET project files (*.csproj, *.fsproj, *.vbproj) or legacy NuGet configuration files
            if find . -maxdepth 2 -name "*.csproj" -o -name "*.fsproj" -o -name "*.vbproj" -o -name "packages.config" -o -name "project.json" | grep -q .; then
              NEEDS_DOTNET=true  # Set flag to install .NET dependencies later
              echo "✓ Detected: .NET project"
              
              # Detect .NET framework version from project file
              # Reads TargetFramework property from .csproj files to determine required .NET version
              DOTNET_VERSION=""
              if find . -maxdepth 2 -name "*.csproj" | head -1 | xargs grep -i "TargetFramework" 2>/dev/null | grep -oP '\d+\.\d+' | head -1; then
                DOTNET_VERSION=$(find . -maxdepth 2 -name "*.csproj" | head -1 | xargs grep -i "TargetFramework" 2>/dev/null | grep -oP '\d+\.\d+' | head -1)
                echo "  .NET version: $DOTNET_VERSION"
              fi
              
              # Install .NET SDK if not already available
              # Uses Microsoft's official .NET installation script
              if ! command -v dotnet &> /dev/null; then
                echo "  Installing .NET SDK..."
                # Download and execute Microsoft's .NET installation script
                wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
                chmod +x dotnet-install.sh
                # Install LTS (Long Term Support) channel .NET SDK
                ./dotnet-install.sh --channel LTS || echo "  Warning: Could not install .NET SDK"
                # Add .NET to PATH for subsequent commands
                export PATH="$HOME/.dotnet:$PATH"
              fi
            fi
            
            # Detect Go projects
            # Checks for Go module files (go.mod, go.sum) or legacy dependency management (Gopkg.toml)
            if [ -f go.mod ] || [ -f go.sum ] || [ -f Gopkg.toml ]; then
              NEEDS_GO=true  # Set flag to install Go dependencies later
              echo "✓ Detected: Go project"
              
              # Detect required Go version from go.mod file
              # Go version is specified at the top of go.mod as "go 1.21" format
              GO_VERSION=""
              if [ -f go.mod ]; then
                GO_VERSION=$(grep -i "^go " go.mod | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$GO_VERSION" ]; then
                  echo "  Go version from go.mod: $GO_VERSION"
                fi
              fi
              
              # Install the specific Go version if detected
              if [ -n "$GO_VERSION" ]; then
                echo "  Installing Go $GO_VERSION..."
                # Download Go binary tarball for Linux x86_64 architecture
                wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -O go.tar.gz || echo "  Warning: Could not download Go $GO_VERSION"
                if [ -f go.tar.gz ]; then
                  # Remove existing Go installation and extract new version to /usr/local/go
                  sudo rm -rf /usr/local/go
                  sudo tar -C /usr/local -xzf go.tar.gz
                  # Add Go binaries to PATH
                  export PATH="/usr/local/go/bin:$PATH"
                fi
              elif ! command -v go &> /dev/null; then
                # If no specific version detected but Go is not installed, install a default version
                echo "  Installing latest Go..."
                wget -q "https://go.dev/dl/go1.21.0.linux-amd64.tar.gz" -O go.tar.gz || true
                if [ -f go.tar.gz ]; then
                  # Extract Go to standard location and add to PATH
                  sudo rm -rf /usr/local/go
                  sudo tar -C /usr/local -xzf go.tar.gz
                  export PATH="/usr/local/go/bin:$PATH"
                fi
              fi
            fi
            
            # Detect PHP projects
            # Checks for Composer dependency management files (composer.json, composer.lock)
            if [ -f composer.json ] || [ -f composer.lock ]; then
              NEEDS_PHP=true  # Set flag to install PHP dependencies later
              echo "✓ Detected: PHP project"
              
              # Detect required PHP version from composer.json requirements
              # Composer specifies PHP version in the "require" section as "php": "^8.1"
              PHP_VERSION=""
              if [ -f composer.json ]; then
                PHP_VERSION=$(grep -i '"php"' composer.json | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PHP_VERSION" ]; then
                  echo "  PHP version from composer.json: $PHP_VERSION"
                fi
              fi
              
              # Install PHP and required extensions if not already available
              # PHP is needed to run Composer (the PHP dependency manager)
              if ! command -v php &> /dev/null; then
                echo "  Installing PHP..."
                # Update package list and install PHP with essential extensions
                # php-xml, php-mbstring, php-curl are commonly needed by Composer
                sudo apt-get update -qq || true
                sudo apt-get install -y php php-cli php-xml php-mbstring php-curl || echo "  Warning: Could not install PHP"
              fi
              
              # Install Composer (PHP dependency manager) if not available
              # Composer is the standard PHP package manager
              if ! command -v composer &> /dev/null; then
                echo "  Installing Composer..."
                # Download and execute Composer installer script
                curl -sS https://getcomposer.org/installer | php
                # Move Composer to system PATH for global availability
                sudo mv composer.phar /usr/local/bin/composer || true
              fi
            fi
            
            # Detect Ruby projects
            # Checks for Ruby dependency management files (Gemfile, Gemfile.lock)
            if [ -f Gemfile ] || [ -f Gemfile.lock ]; then
              NEEDS_RUBY=true  # Set flag to install Ruby dependencies later
              echo "✓ Detected: Ruby project"
              
              # Detect required Ruby version from version files or Gemfile
              RUBY_VERSION=""
              if [ -f .ruby-version ]; then
                # .ruby-version file is the most explicit version specification (used by rbenv/rvm)
                RUBY_VERSION=$(cat .ruby-version | xargs)
                echo "  Ruby version from .ruby-version: $RUBY_VERSION"
              elif [ -f Gemfile ]; then
                # Gemfile may specify Ruby version in a "ruby" directive
                RUBY_VERSION=$(grep -i "ruby" Gemfile | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$RUBY_VERSION" ]; then
                  echo "  Ruby version from Gemfile: $RUBY_VERSION"
                fi
              fi
              
              # Install Ruby using rbenv (Ruby version manager) if needed
              # rbenv allows installing multiple Ruby versions and switching between them
              if ! command -v ruby &> /dev/null || [ -n "$RUBY_VERSION" ]; then
                echo "  Installing Ruby..."
                # Install rbenv if not available
                if ! command -v rbenv &> /dev/null; then
                  git clone https://github.com/rbenv/rbenv.git ~/.rbenv
                  export PATH="$HOME/.rbenv/bin:$PATH"
                  eval "$(rbenv init -)"  # Initialize rbenv shell integration
                fi
                # Install the specific Ruby version if detected
                if [ -n "$RUBY_VERSION" ]; then
                  rbenv install -s "$RUBY_VERSION" || echo "  Warning: Could not install Ruby $RUBY_VERSION"
                  rbenv global "$RUBY_VERSION"  # Set as the default Ruby version
                fi
              fi
              
              # Install Bundler (Ruby dependency manager) if needed
              # Bundler is used to install gems from Gemfile
              if ! command -v bundle &> /dev/null; then
                gem install bundler || true  # Install via Ruby's gem package manager
              fi
            fi
            
            # Detect Rust projects
            # Checks for Cargo (Rust package manager) configuration files
            if [ -f Cargo.toml ] || [ -f Cargo.lock ]; then
              NEEDS_RUST=true  # Set flag to install Rust dependencies later
              echo "✓ Detected: Rust project"
              
              # Install Rust toolchain if not already available
              # Uses rustup (Rust toolchain installer) which installs rustc (compiler) and cargo (package manager)
              if ! command -v rustc &> /dev/null; then
                echo "  Installing Rust..."
                # Download and execute rustup installer script with -y flag for non-interactive mode
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                # Source cargo environment to make rust/cargo commands available immediately
                source "$HOME/.cargo/env"
              fi
            fi
            
            # Detect Swift/Objective-C projects
            # Checks for Swift Package Manager (Package.swift) or CocoaPods (Podfile) files
            # Note: Swift development typically requires macOS, so installation is skipped on Linux runners
            if [ -f Package.swift ] || [ -f Podfile ] || [ -f Podfile.lock ]; then
              NEEDS_SWIFT=true  # Set flag (though dependencies won't be installed on Linux)
              echo "✓ Detected: Swift/Objective-C project"
              echo "  Note: Swift requires macOS runners, skipping installation on Linux"
              # Swift toolchain installation would require macOS GitHub Actions runners
              # This detection is included for completeness but won't actually install Swift on Linux
            fi
            
            # SECTION: Install project dependencies based on detected languages
            # This section installs all dependencies for each detected language ecosystem
            # Dependencies must be installed before Snyk can scan them for vulnerabilities
            echo ""
            echo "Installing project dependencies for $branch..."
            
            # Install Node.js/JavaScript dependencies
            # Uses the appropriate package manager (yarn, pnpm, or npm) based on lock files present
            if [ "$NEEDS_NODE" = true ]; then
              if [ -f yarn.lock ]; then
                # Yarn: prefer frozen lockfile (exact versions), fallback to regular install if that fails
                yarn install --frozen-lockfile || yarn install || true
              elif [ -f pnpm-lock.yaml ]; then
                # pnpm: prefer frozen lockfile, fallback to regular install if that fails
                pnpm install --frozen-lockfile || pnpm install || true
              elif [ -f package-lock.json ]; then
                # npm: prefer ci (clean install with exact versions from lockfile), fallback to regular install
                npm ci || npm install || true
              elif [ -f package.json ]; then
                # npm: regular install if no lockfile exists
                npm install || true
              fi
            fi
            
            # Install Java dependencies (Maven, Gradle, or sbt)
            # Downloads and caches dependencies for vulnerability scanning
            if [ "$NEEDS_JAVA" = true ]; then
              if [ -f gradlew ]; then
                # Gradle: use Gradle wrapper to download dependencies (--no-daemon to avoid background processes)
                ./gradlew dependencies --no-daemon || true
              elif [ -f pom.xml ]; then
                # Maven: install Maven if not available, then resolve dependencies
                if ! command -v mvn &> /dev/null; then
                  echo "  Installing Maven..."
                  # Download and extract Maven from Apache archive
                  wget https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz
                  tar -xzf apache-maven-3.9.5-bin.tar.gz
                  export PATH="$PWD/apache-maven-3.9.5/bin:$PATH"
                fi
                # Resolve Maven dependencies without running full build
                mvn dependency:resolve || true
              elif [ -f build.sbt ]; then
                # sbt (Scala): install sbt if not available, then update dependencies
                if ! command -v sbt &> /dev/null; then
                  echo "  Installing sbt..."
                  # Download sbt launcher script
                  curl -s "https://raw.githubusercontent.com/sbt/sbt/1.x/sbt" > sbt
                  chmod +x sbt
                  export PATH="$PWD:$PATH"
                fi
                # Update sbt dependencies
                sbt update || true
              fi
            fi
            
            # Install Python dependencies
            # Uses the appropriate package manager (pipenv, poetry, pip) based on configuration files
            if [ "$NEEDS_PYTHON" = true ]; then
              if [ -f Pipfile ]; then
                # pipenv: install dependencies (include dev dependencies if available, fallback to production)
                pipenv install --dev || pipenv install || true
              elif [ -f poetry.lock ] || [ -f pyproject.toml ]; then
                # Poetry: install dependencies from lockfile or pyproject.toml
                poetry install || true
              elif [ -f requirements.txt ]; then
                # pip: install from requirements.txt file
                pip install -r requirements.txt || true
              elif [ -f setup.py ]; then
                # pip: install package in editable/development mode
                pip install -e . || true
              fi
            fi
            
            # Install .NET dependencies (NuGet packages)
            if [ "$NEEDS_DOTNET" = true ]; then
              # dotnet restore downloads NuGet packages specified in project files
              dotnet restore || true
            fi
            
            # Download Go module dependencies
            if [ "$NEEDS_GO" = true ]; then
              # go mod download downloads Go modules to local cache (does not build)
              go mod download || true
            fi
            
            # Install PHP dependencies (Composer packages)
            if [ "$NEEDS_PHP" = true ]; then
              # composer install downloads PHP packages from composer.json (--no-interaction for non-interactive mode)
              composer install --no-interaction || true
            fi
            
            # Install Ruby dependencies (Bundler gems)
            if [ "$NEEDS_RUBY" = true ]; then
              # bundle install installs gems from Gemfile
              bundle install || true
            fi
            
            # Download Rust dependencies (Cargo crates)
            if [ "$NEEDS_RUST" = true ]; then
              # cargo fetch downloads Rust crates without building (faster than cargo build)
              cargo fetch || true
            fi
            
            echo "Dependency detection and installation completed for $branch"
            echo ""
            
            # SECTION: Snyk Security Scans
            # After dependencies are installed, run multiple types of Snyk security scans:
            # 1. SCA (Software Composition Analysis) - scans dependencies for vulnerabilities
            # 2. SAST (Static Application Security Testing) - scans source code for security issues
            # 3. Container scanning - scans Docker images for vulnerabilities
            
            # Set project name with repo and branch for consistent naming in Snyk UI
            # Format: "owner/repo-name - branch-name"
            PROJECT_NAME="$REPO_NAME - $branch"
            
            # SCA (Software Composition Analysis): Scan and monitor dependencies for vulnerabilities
            # This creates or updates projects in Snyk UI with dependency vulnerability data
            echo "Running Snyk monitor (SCA) for $branch..."
            snyk monitor \
              --all-projects \  # Auto-detect all project types (npm, maven, pip, etc.) in current directory
              --target-reference="$branch" \  # Separate each branch into different targets in Snyk (creates branch-specific views)
              --project-tags="repo=$REPO_NAME,branch=$branch" \  # Add metadata tags for filtering/organizing in Snyk UI
              --severity-threshold=medium || true  # Only report medium and high severity issues (ignore low)
            
            # SAST (Static Application Security Testing): Scan source code for security vulnerabilities
            # This identifies security issues in application code (not just dependencies)
            echo "Running Snyk Code test for $branch..."
            snyk code test \
              --severity-threshold=medium \  # Only report medium and high severity code issues
              --report \  # Generate and upload report to Snyk UI
              --project-name="$PROJECT_NAME SAST" || true  # Name this project distinctly in Snyk UI
            
            # SECTION: Container Security Scanning - Dockerfile Analysis
            # Scans Docker images built from Dockerfiles for vulnerabilities in base images and installed packages
            # This includes scanning both built images and base images if building fails
            echo "Scanning Dockerfiles for $branch..."
            
            # Find all Dockerfiles in the repository (exclude node_modules and .git directories)
            # Pattern matches: Dockerfile, Dockerfile.dev, Dockerfile.prod, etc.
            dockerfile_list=$(find . -name "Dockerfile*" -type f ! -path "*/node_modules/*" ! -path "*/.git/*")
            # Count how many Dockerfiles were found (used for logging)
            dockerfile_count=$(echo "$dockerfile_list" | grep -c . || echo "0")
            
            # If no Dockerfiles found, skip container scanning for this branch
            if [ "$dockerfile_count" -eq 0 ]; then
              echo "No Dockerfiles found in this branch."
            else
              # Process each Dockerfile found in the repository
              echo "Found $dockerfile_count Dockerfile(s). Starting scans..."
              echo ""
              
              # Loop through each Dockerfile found
              echo "$dockerfile_list" | while read -r dockerfile; do
                echo "========================================="
                echo "Scanning Dockerfile: $dockerfile"
                echo "========================================="
                
                # Extract directory path and filename from Dockerfile path
                # These are used for building context and generating image names
                dockerfile_dir=$(dirname "$dockerfile")  # Directory containing the Dockerfile (build context)
                dockerfile_name=$(basename "$dockerfile")  # Just the filename (e.g., Dockerfile.prod)
                
                # Generate a valid Docker image name from the directory path
                # Docker image names must be lowercase, alphanumeric with hyphens only
                if [ "$dockerfile_dir" = "." ]; then
                  # If Dockerfile is in root directory, use a default name
                  image_name="snyk-test-root"
                else
                  # Convert directory path to image name format (e.g., "src/app" -> "snyk-test-src-app")
                  image_name="snyk-test-$(echo "$dockerfile_dir" | tr '/' '-' | tr ' ' '-' | sed 's/^\.-//')"
                fi
                # Normalize image name: lowercase, remove invalid characters, clean up multiple hyphens
                image_name=$(echo "$image_name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
                
                # Fallback: if image name ended up empty after normalization, use default
                if [ -z "$image_name" ]; then
                  image_name="snyk-test-image"
                fi
                
                # Step 1: Attempt to build the Docker image from the Dockerfile
                # This creates a test image that we can scan for vulnerabilities
                echo "Step 1: Attempting to build image: $image_name:latest from $dockerfile..."
                build_success=false
                # Build image using docker build with Dockerfile and build context
                if docker build -t "$image_name:latest" -f "$dockerfile" "$dockerfile_dir" 2>&1; then
                  # Build succeeded - proceed with scanning the built image
                  echo "Successfully built image: $image_name:latest"
                  build_success=true
                  
                  # Step 2: Test the built container image for vulnerabilities
                  # This scans the complete image including base image and installed packages
                  echo "Step 2: Running Snyk container test on built image..."
                  snyk container test "$image_name:latest" \
                    --file="$dockerfile" \  # Reference the Dockerfile for better context in reports
                    --severity-threshold=low \  # Report all severities (low, medium, high) for containers
                    --report \  # Upload test results to Snyk UI
                    --project-name="$PROJECT_NAME Container Image - $dockerfile" || {  # Name this project in Snyk UI
                    echo "Warning: Snyk container test on built image failed."
                  }
                  
                  # Step 3: Monitor the built container image in Snyk
                  # This creates/updates a monitoring project in Snyk UI for continuous vulnerability tracking
                  echo "Step 3: Running Snyk container monitor on built image..."
                  snyk container monitor "$image_name:latest" \
                    --file="$dockerfile" \  # Reference the Dockerfile for monitoring context
                    --project-name="$PROJECT_NAME Container Image - $dockerfile" || {  # Name the monitoring project
                    echo "Warning: Snyk container monitor on built image failed."
                  }
                else
                  # Build failed - fallback: try to scan the base image instead
                  # This is useful when Dockerfile has build issues but base image can still be scanned
                  echo "Warning: Could not build image from $dockerfile."
                  echo "Attempting to extract and scan base image from Dockerfile..."
                  
                  # Extract base image name from Dockerfile's FROM instruction
                  # Format: FROM ubuntu:20.04 -> extracts "ubuntu:20.04"
                  # Removes SHA digest (@sha256:...) and extracts just image:tag
                  base_image=$(grep -i "^FROM" "$dockerfile" | head -1 | awk '{print $2}' | cut -d'@' -f1 | cut -d':' -f1-2)
                  
                  # If base image was successfully extracted, try to scan it
                  if [ -n "$base_image" ] && [ "$base_image" != "FROM" ]; then
                    echo "Found base image: $base_image"
                    
                    # Step 2: Pull the base image from Docker registry
                    # This allows scanning even if we can't build the full image
                    echo "Step 2: Attempting to pull base image: $base_image..."
                    if docker pull "$base_image" 2>&1; then
                      echo "Successfully pulled base image: $base_image"
                      
                      # Verify the pulled image exists locally before scanning
                      if docker image inspect "$base_image" >/dev/null 2>&1; then
                        echo "Step 3: Scanning base image for vulnerabilities..."
                        
                        # Test the base image for vulnerabilities
                        # Base images often contain known vulnerabilities
                        snyk container test "$base_image" \
                          --file="$dockerfile" \  # Reference original Dockerfile for context
                          --severity-threshold=low \  # Report all severities
                          --report \  # Upload results to Snyk UI
                          --project-name="$PROJECT_NAME Container Base - $dockerfile" || {  # Name project with "Base" suffix
                          echo "Warning: Snyk container test on base image failed."
                        }
                        
                        # Monitor the base image in Snyk UI for continuous tracking
                        echo "Step 4: Running Snyk container monitor on base image..."
                        snyk container monitor "$base_image" \
                          --file="$dockerfile" \  # Reference Dockerfile for monitoring
                          --project-name="$PROJECT_NAME Container Base - $dockerfile" || {  # Name monitoring project
                          echo "Warning: Snyk container monitor on base image failed."
                        }
                      else
                        echo "Warning: Base image $base_image could not be verified locally. Skipping scan."
                      fi
                    else
                      # Pull failed - try alternative image names for deprecated/common replacements
                      # Example: openjdk is deprecated, use eclipse-temurin instead
                      echo "Warning: Could not pull base image: $base_image"
                      echo "The image may not exist, be deprecated, or require authentication."
                      
                      # Try alternative image names for common deprecated images
                      alternative_image=""
                      if echo "$base_image" | grep -qi "openjdk"; then
                        # Map openjdk to eclipse-temurin (the replacement)
                        # Preserve tag if present, otherwise use default
                        tag=$(echo "$base_image" | cut -d':' -f2)
                        if [ -n "$tag" ]; then
                          alternative_image="eclipse-temurin:${tag}"
                        else
                          alternative_image="eclipse-temurin:17-jdk-alpine"
                        fi
                        echo "Attempting alternative image: $alternative_image..."
                        
                        # Try pulling and scanning the alternative image
                        if docker pull "$alternative_image" 2>&1; then
                          echo "Successfully pulled alternative image: $alternative_image"
                          if docker image inspect "$alternative_image" >/dev/null 2>&1; then
                            echo "Scanning alternative base image for vulnerabilities..."
                            # Test alternative image
                            snyk container test "$alternative_image" \
                              --file="$dockerfile" \
                              --severity-threshold=low \
                              --report \
                              --project-name="$PROJECT_NAME Container Base (Alt) - $dockerfile" || {
                              echo "Warning: Snyk container test on alternative base image failed."
                            }
                            
                            # Monitor alternative image
                            snyk container monitor "$alternative_image" \
                              --file="$dockerfile" \
                              --project-name="$PROJECT_NAME Container Base (Alt) - $dockerfile" || {
                              echo "Warning: Snyk container monitor on alternative base image failed."
                            }
                          fi
                        else
                          echo "Alternative image also failed. Cannot scan base image."
                        fi
                      else
                        # No alternative mapping available for this base image type
                        echo "No alternative image mapping available. Cannot scan base image."
                      fi
                    fi
                  else
                    # Could not extract valid base image name from Dockerfile
                    echo "Could not extract base image from Dockerfile. Skipping base image scan."
                  fi
                fi
                
                # Mark this Dockerfile as completed
                echo "Completed scanning Dockerfile: $dockerfile"
                echo ""
              done
              
              # Summary: All Dockerfiles processed
              echo "Completed scanning all $dockerfile_count Dockerfile(s)."
            fi
            echo ""
            
            # SECTION: Container Security Scanning - Docker Compose Services
            # Scans Docker images defined in docker-compose.yml files
            # Docker Compose often defines multiple services with their own images to scan
            echo "Scanning docker-compose services for $branch..."
            
            # Find all docker-compose files (various naming conventions: docker-compose.yml, docker-compose.prod.yaml, etc.)
            find . \( -name "docker-compose*.yml" -o -name "docker-compose*.yaml" \) -type f ! -path "*/node_modules/*" ! -path "*/.git/*" | while read -r compose_file; do
              echo "Found docker-compose file: $compose_file"
              
              # Extract service names and build contexts from docker-compose file
              # Uses docker compose config command to parse the YAML file
              if command -v docker-compose &> /dev/null || docker compose version &> /dev/null; then
                # Get list of all services defined in docker-compose file
                # Try both "docker compose" (new syntax) and "docker-compose" (legacy) commands
                services=$(docker compose -f "$compose_file" config --services 2>/dev/null || docker-compose -f "$compose_file" config --services 2>/dev/null || echo "")
                
                # Process each service defined in the docker-compose file
                if [ -n "$services" ]; then
                  echo "$services" | while read -r service; do
                    echo "Processing service: $service from $compose_file"
                    
                    # Generate a temporary image name for the service
                    # Convert service name to lowercase Docker image name format
                    service_image="snyk-test-$(echo "$service" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')"
                    
                    # Build the Docker image for this service using docker-compose
                    # This builds the image according to the service's build configuration
                    if docker compose -f "$compose_file" build "$service" 2>/dev/null || docker-compose -f "$compose_file" build "$service" 2>/dev/null; then
                      # Extract the actual image name/tag that docker-compose assigned to this service
                      # This may differ from our temporary service_image name
                      image_tag=$(docker compose -f "$compose_file" config 2>/dev/null | grep -A 5 "services:" | grep -A 5 "$service:" | grep "image:" | head -1 | awk '{print $2}' | tr -d '"' || echo "${service_image}:latest")
                      
                      # Find associated Dockerfile path for this service (if specified in docker-compose)
                      # Docker Compose can specify build context and dockerfile path separately
                      build_context=$(docker compose -f "$compose_file" config 2>/dev/null | grep -A 10 "services:" | grep -A 10 "$service:" | grep -A 5 "build:" | grep "context:" | head -1 | awk '{print $2}' | tr -d '"' || echo ".")
                      dockerfile_path=$(docker compose -f "$compose_file" config 2>/dev/null | grep -A 10 "services:" | grep -A 10 "$service:" | grep -A 5 "build:" | grep "dockerfile:" | head -1 | awk '{print $2}' | tr -d '"' || echo "")
                      
                      # Determine Dockerfile path for Snyk scanning
                      # Prefer explicit dockerfile path, fallback to Dockerfile in build context
                      if [ -n "$dockerfile_path" ] && [ -f "$dockerfile_path" ]; then
                        dockerfile_arg="--file=$dockerfile_path"  # Use explicit Dockerfile path
                      elif [ -f "$build_context/Dockerfile" ]; then
                        dockerfile_arg="--file=$build_context/Dockerfile"  # Use default Dockerfile in build context
                      else
                        dockerfile_arg=""  # No Dockerfile available (image pulled from registry)
                      fi
                      
                      # Scan the service's container image for vulnerabilities
                      echo "Running Snyk container test for service $service ($image_tag)..."
                      if [ -n "$dockerfile_arg" ]; then
                        # Test with Dockerfile reference (provides better context in reports)
                        snyk container test "$image_tag" $dockerfile_arg \
                          --severity-threshold=medium \  # Report medium and high severity issues
                          --report \  # Upload test results to Snyk UI
                          --project-name="$PROJECT_NAME Container - $service" || true  # Name project with service name
                        
                        # Monitor the service image in Snyk UI
                        snyk container monitor "$image_tag" $dockerfile_arg \
                          --project-name="$PROJECT_NAME Container - $service" || true
                      else
                        # Test without Dockerfile (image-only scanning)
                        snyk container test "$image_tag" \
                          --severity-threshold=medium \
                          --report \
                          --project-name="$PROJECT_NAME Container - $service" || true
                        
                        # Monitor without Dockerfile reference
                        snyk container monitor "$image_tag" \
                          --project-name="$PROJECT_NAME Container - $service" || true
                      fi
                    fi
                  done
                fi
              fi
            done
            
            # SECTION: Container Security Scanning - OCI/Docker Archive Files
            # Scans container images that have been saved as .tar archive files
            # These are typically exported Docker images (docker save) or OCI image archives
            echo "Scanning container archives for $branch..."
            
            # Find all .tar files in the repository (could be container image archives)
            # Exclude common directories that shouldn't contain container archives
            find . -name "*.tar" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" | while read -r archive; do
              echo "Found container archive: $archive"
              
              # Determine archive type by inspecting its contents
              # Docker archives contain both manifest.json and repositories files
              # OCI archives have different structure
              if tar -tf "$archive" | grep -q "manifest.json" && tar -tf "$archive" | grep -q "repositories"; then
                archive_type="docker-archive"  # Docker image format (created with docker save)
              else
                archive_type="oci-archive"  # OCI (Open Container Initiative) image format
              fi
              
              # Test the container archive for vulnerabilities
              # Format: archive-type:path/to/archive.tar
              echo "Running Snyk container test for $archive_type:$archive..."
              snyk container test "$archive_type:$archive" \
                --severity-threshold=medium \  # Report medium and high severity issues
                --report \  # Upload test results to Snyk UI
                --project-name="$PROJECT_NAME Container Archive - $(basename $archive)" || true  # Name project with archive filename
              
              # Monitor the container archive in Snyk UI for continuous tracking
              snyk container monitor "$archive_type:$archive" \
                --project-name="$PROJECT_NAME Container Archive - $(basename $archive)" || true
            done
            
            # Mark this branch as completely scanned
            # All scan types (SCA, SAST, containers) have been completed for this branch
            echo "Completed scanning branch: $branch"
            echo ""
          done
          # End of branch loop - return to top to process next branch
