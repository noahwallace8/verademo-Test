name: Snyk Security Scan (All Branches)

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  snyk-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      # Minimal Node.js setup (required for Snyk CLI installation)
      - name: Set up Node.js (for Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Default, will be overridden per branch if detected

      # Install Snyk CLI
      - name: Install Snyk CLI
        id: install-snyk-cli
        run: |
          npm install -g snyk

      # Install GitHub CLI and jq
      - name: Install GitHub CLI and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt-get update \
          && sudo apt-get install gh -y

      # Set up Docker Buildx (for building container images)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Create required labels if they don't exist
      - name: Create Issue Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create labels if they don't exist (ignore errors if they already exist)
          gh label create "security" --color "B60205" --description "Security vulnerability" 2>/dev/null || true
          gh label create "snyk" --color "4A148C" --description "Snyk scan finding" 2>/dev/null || true
          gh label create "sast" --color "D93F0B" --description "Static Application Security Testing" 2>/dev/null || true
          gh label create "SCA" --color "FBCA04" --description "Software Composition Analysis" 2>/dev/null || true
          gh label create "container" --color "0E8A16" --description "Container security" 2>/dev/null || true
          echo "✓ Labels verified/created"

      # Get all branches and scan each one
      - name: Scan all branches
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh CLI automatically uses GH_TOKEN environment variable
          echo "Verifying GitHub CLI can create issues..."
          gh auth status
          
          # Fetch all remote branches
          git fetch --all
          
          # Get list of all branches (excluding HEAD)
          branches=$(git branch -r | grep -v HEAD | sed 's/origin\///' | sed 's/^[[:space:]]*//' | sort -u)
          
          # Calculate date 30 days ago (Unix timestamp)
          CUTOFF_DATE=$(date -d "30 days ago" +%s)
          
          # Loop through each branch
          for branch in $branches; do
            echo "========================================="
            echo "Checking branch: $branch"
            echo "========================================="
            
            # Get the last commit date for this branch (Unix timestamp)
            LAST_COMMIT_DATE=$(git log -1 --format=%ct "origin/$branch" 2>/dev/null)
            
            # Skip if we can't get the commit date
            if [ -z "$LAST_COMMIT_DATE" ]; then
              echo "Skipping $branch: Unable to get commit date"
              echo ""
              continue
            fi
            
            # Check if branch is dormant (last commit older than 30 days)
            if [ "$LAST_COMMIT_DATE" -lt "$CUTOFF_DATE" ]; then
              LAST_COMMIT_READABLE=$(git log -1 --format=%cd --date=short "origin/$branch" 2>/dev/null)
              echo "Skipping $branch: Last commit was on $LAST_COMMIT_READABLE (dormant >30 days)"
              echo ""
              continue
            fi
            
            # Branch is active, proceed with scanning
            LAST_COMMIT_READABLE=$(git log -1 --format=%cd --date=short "origin/$branch" 2>/dev/null)
            echo "Branch $branch is active (last commit: $LAST_COMMIT_READABLE). Proceeding with scan..."
            echo ""
            
            # Checkout the branch
            git checkout -f "$branch" || continue
            
            # ============================================
            # Comprehensive Dependency Detection and Installation
            # Detects all Snyk-supported languages and installs required tools
            # ============================================
            echo "========================================="
            echo "Detecting dependencies for branch: $branch"
            echo "========================================="
            
            # Track what we need to install
            NEEDS_NODE=false
            NEEDS_JAVA=false
            NEEDS_PYTHON=false
            NEEDS_DOTNET=false
            NEEDS_GO=false
            NEEDS_PHP=false
            NEEDS_RUBY=false
            NEEDS_RUST=false
            NEEDS_SWIFT=false
            
            # Detect Node.js/JavaScript projects
            if [ -f package.json ] || [ -f yarn.lock ] || [ -f pnpm-lock.yaml ] || [ -f package-lock.json ]; then
              NEEDS_NODE=true
              echo "✓ Detected: Node.js/JavaScript project"
              
              # Detect Node.js version
              NODE_VERSION=""
              if [ -f .nvmrc ]; then
                NODE_VERSION=$(cat .nvmrc | tr -d 'v' | xargs)
                echo "  Node.js version from .nvmrc: $NODE_VERSION"
              elif [ -f .node-version ]; then
                NODE_VERSION=$(cat .node-version | tr -d 'v' | xargs)
                echo "  Node.js version from .node-version: $NODE_VERSION"
              elif [ -f package.json ]; then
                # Try to extract from package.json engines field
                if command -v node &> /dev/null && command -v jq &> /dev/null; then
                  NODE_VERSION=$(jq -r '.engines.node // empty' package.json 2>/dev/null | sed 's/[^0-9.]//g' | head -c 4)
                elif grep -q '"engines"' package.json; then
                  NODE_VERSION=$(grep -A 2 '"engines"' package.json | grep -oP '"node"\s*:\s*"[^"]*"' | grep -oP '\d+\.\d+' | head -1)
                fi
                if [ -n "$NODE_VERSION" ]; then
                  echo "  Node.js version from package.json: $NODE_VERSION"
                fi
              fi
              
              # Install/switch Node.js version if detected
              if [ -n "$NODE_VERSION" ] && [ "$NODE_VERSION" != "20" ]; then
                echo "  Installing Node.js $NODE_VERSION..."
                # Use n to install Node.js version
                if ! command -v n &> /dev/null; then
                  npm install -g n
                fi
                n "$NODE_VERSION" || echo "  Warning: Could not install Node.js $NODE_VERSION, using default"
              fi
              
              # Detect package manager
              if [ -f yarn.lock ]; then
                echo "  Package manager: Yarn"
                if ! command -v yarn &> /dev/null; then
                  npm install -g yarn
                fi
              elif [ -f pnpm-lock.yaml ]; then
                echo "  Package manager: pnpm"
                if ! command -v pnpm &> /dev/null; then
                  npm install -g pnpm
                fi
              else
                echo "  Package manager: npm"
              fi
            fi
            
            # Detect Java projects (Maven, Gradle)
            if [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f gradlew ] || [ -f build.sbt ]; then
              NEEDS_JAVA=true
              echo "✓ Detected: Java project"
              
              # Detect Java version
              JAVA_VERSION=""
              JAVA_DISTRIBUTION="temurin"
              
              if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
                echo "  Build tool: Gradle"
                # Check gradle.properties first
                if [ -f gradle.properties ]; then
                  JAVA_VERSION=$(grep -i "javaVersion\|java.version" gradle.properties | head -1 | grep -oP '\d+' | head -1)
                  if [ -n "$JAVA_VERSION" ]; then
                    echo "  Java version from gradle.properties: $JAVA_VERSION"
                  fi
                fi
                
                # Check build.gradle for sourceCompatibility or java toolchain
                if [ -z "$JAVA_VERSION" ] && [ -f build.gradle ]; then
                  JAVA_VERSION=$(grep -i "sourceCompatibility\|java.toolchain.languageVersion" build.gradle | head -1 | grep -oP '\d+' | head -1)
                  if [ -n "$JAVA_VERSION" ]; then
                    echo "  Java version from build.gradle: $JAVA_VERSION"
                  fi
                fi
                
                # Check for Java distribution preference
                if [ -f gradle.properties ]; then
                  if grep -qi "adopt\|adoptium\|temurin" gradle.properties; then
                    JAVA_DISTRIBUTION="temurin"
                  elif grep -qi "zulu" gradle.properties; then
                    JAVA_DISTRIBUTION="zulu"
                  elif grep -qi "amazon" gradle.properties; then
                    JAVA_DISTRIBUTION="amazon"
                  fi
                fi
                
                # Make gradlew executable
                if [ -f gradlew ]; then
                  chmod +x gradlew
                  echo "  Made gradlew executable"
                fi
              elif [ -f pom.xml ]; then
                echo "  Build tool: Maven"
                JAVA_VERSION=$(grep -i "<maven.compiler.source\|<java.version>" pom.xml | head -1 | grep -oP '\d+' | head -1)
                if [ -n "$JAVA_VERSION" ]; then
                  echo "  Java version from pom.xml: $JAVA_VERSION"
                fi
              elif [ -f build.sbt ]; then
                echo "  Build tool: sbt (Scala)"
                JAVA_VERSION=$(grep -i "javaVersion\|scalaVersion" build.sbt | head -1 | grep -oP '\d+' | head -1)
                if [ -n "$JAVA_VERSION" ]; then
                  echo "  Java version from build.sbt: $JAVA_VERSION"
                fi
              fi
              
              # Install Java if needed
              if [ -n "$JAVA_VERSION" ]; then
                echo "  Installing Java $JAVA_VERSION ($JAVA_DISTRIBUTION)..."
                # Use setup-java action via GitHub Actions API (if available) or SDKMAN
                if [ -n "$GITHUB_ACTIONS" ]; then
                  # In GitHub Actions, we can use the setup-java action
                  # For now, check if Java is already installed with correct version
                  CURRENT_JAVA=$(java -version 2>&1 | head -1 | grep -oP 'version "(\d+)' | grep -oP '\d+' || echo "")
                  if [ "$CURRENT_JAVA" != "$JAVA_VERSION" ]; then
                    echo "  Java $JAVA_VERSION needed but not available. Installing via SDKMAN..."
                    curl -s "https://get.sdkman.io" | bash || true
                    source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null || true
                    if command -v sdk &> /dev/null; then
                      sdk install java "${JAVA_VERSION}.0-tem" || sdk install java "${JAVA_VERSION}.0.0-tem" || echo "  Warning: Could not install Java $JAVA_VERSION"
                    fi
                  fi
                fi
              fi
            fi
            
            # Detect Python projects
            if [ -f requirements.txt ] || [ -f Pipfile ] || [ -f poetry.lock ] || [ -f pyproject.toml ] || [ -f setup.py ] || [ -f environment.yml ] || [ -f conda.yml ]; then
              NEEDS_PYTHON=true
              echo "✓ Detected: Python project"
              
              # Detect Python version
              PYTHON_VERSION=""
              if [ -f .python-version ]; then
                PYTHON_VERSION=$(cat .python-version | xargs)
                echo "  Python version from .python-version: $PYTHON_VERSION"
              elif [ -f runtime.txt ]; then
                PYTHON_VERSION=$(grep -i python runtime.txt | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PYTHON_VERSION" ]; then
                  echo "  Python version from runtime.txt: $PYTHON_VERSION"
                fi
              elif [ -f pyproject.toml ]; then
                PYTHON_VERSION=$(grep -i "requires-python\|python_version" pyproject.toml | head -1 | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PYTHON_VERSION" ]; then
                  echo "  Python version from pyproject.toml: $PYTHON_VERSION"
                fi
              fi
              
              # Install Python if needed
              if [ -n "$PYTHON_VERSION" ]; then
                echo "  Installing Python $PYTHON_VERSION..."
                # Use deadsnakes PPA or pyenv
                sudo apt-get update -qq || true
                sudo apt-get install -y "python${PYTHON_VERSION}" "python${PYTHON_VERSION}-dev" "python${PYTHON_VERSION}-venv" || echo "  Warning: Could not install Python $PYTHON_VERSION"
              fi
              
              # Detect package manager
              if [ -f Pipfile ]; then
                echo "  Package manager: pipenv"
                if ! command -v pipenv &> /dev/null; then
                  pip install pipenv || true
                fi
              elif [ -f poetry.lock ] || [ -f pyproject.toml ]; then
                echo "  Package manager: poetry"
                if ! command -v poetry &> /dev/null; then
                  pip install poetry || true
                fi
              elif [ -f environment.yml ] || [ -f conda.yml ]; then
                echo "  Package manager: conda"
                if ! command -v conda &> /dev/null; then
                  echo "  Warning: Conda not available, install manually if needed"
                fi
              else
                echo "  Package manager: pip"
              fi
            fi
            
            # Detect .NET projects
            if find . -maxdepth 2 -name "*.csproj" -o -name "*.fsproj" -o -name "*.vbproj" -o -name "packages.config" -o -name "project.json" | grep -q .; then
              NEEDS_DOTNET=true
              echo "✓ Detected: .NET project"
              
              # Detect .NET version
              DOTNET_VERSION=""
              if find . -maxdepth 2 -name "*.csproj" | head -1 | xargs grep -i "TargetFramework" 2>/dev/null | grep -oP '\d+\.\d+' | head -1; then
                DOTNET_VERSION=$(find . -maxdepth 2 -name "*.csproj" | head -1 | xargs grep -i "TargetFramework" 2>/dev/null | grep -oP '\d+\.\d+' | head -1)
                echo "  .NET version: $DOTNET_VERSION"
              fi
              
              # Install .NET SDK if needed
              if ! command -v dotnet &> /dev/null; then
                echo "  Installing .NET SDK..."
                wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
                chmod +x dotnet-install.sh
                ./dotnet-install.sh --channel LTS || echo "  Warning: Could not install .NET SDK"
                export PATH="$HOME/.dotnet:$PATH"
              fi
            fi
            
            # Detect Go projects
            if [ -f go.mod ] || [ -f go.sum ] || [ -f Gopkg.toml ]; then
              NEEDS_GO=true
              echo "✓ Detected: Go project"
              
              # Detect Go version
              GO_VERSION=""
              if [ -f go.mod ]; then
                GO_VERSION=$(grep "^go " go.mod | awk '{print $2}' | head -1)
                echo "  Go version from go.mod: $GO_VERSION"
              fi
              
              # Install Go if needed
              if [ -n "$GO_VERSION" ]; then
                echo "  Installing Go $GO_VERSION..."
                wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -O go.tar.gz || echo "  Warning: Could not download Go $GO_VERSION"
                if [ -f go.tar.gz ]; then
                  sudo rm -rf /usr/local/go
                  sudo tar -C /usr/local -xzf go.tar.gz
                  export PATH="/usr/local/go/bin:$PATH"
                fi
              elif ! command -v go &> /dev/null; then
                echo "  Installing latest Go..."
                wget -q "https://go.dev/dl/go1.21.0.linux-amd64.tar.gz" -O go.tar.gz || true
                if [ -f go.tar.gz ]; then
                  sudo rm -rf /usr/local/go
                  sudo tar -C /usr/local -xzf go.tar.gz
                  export PATH="/usr/local/go/bin:$PATH"
                fi
              fi
            fi
            
            # Detect PHP projects
            if [ -f composer.json ] || [ -f composer.lock ]; then
              NEEDS_PHP=true
              echo "✓ Detected: PHP project"
              
              # Detect PHP version
              PHP_VERSION=""
              if [ -f composer.json ]; then
                PHP_VERSION=$(grep -i '"php"' composer.json | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$PHP_VERSION" ]; then
                  echo "  PHP version from composer.json: $PHP_VERSION"
                fi
              fi
              
              # Install PHP and Composer if needed
              if ! command -v php &> /dev/null; then
                echo "  Installing PHP..."
                sudo apt-get update -qq || true
                sudo apt-get install -y php php-cli php-xml php-mbstring php-curl || echo "  Warning: Could not install PHP"
              fi
              
              if ! command -v composer &> /dev/null; then
                echo "  Installing Composer..."
                curl -sS https://getcomposer.org/installer | php
                sudo mv composer.phar /usr/local/bin/composer || true
              fi
            fi
            
            # Detect Ruby projects
            if [ -f Gemfile ] || [ -f Gemfile.lock ]; then
              NEEDS_RUBY=true
              echo "✓ Detected: Ruby project"
              
              # Detect Ruby version
              RUBY_VERSION=""
              if [ -f .ruby-version ]; then
                RUBY_VERSION=$(cat .ruby-version | xargs)
                echo "  Ruby version from .ruby-version: $RUBY_VERSION"
              elif [ -f Gemfile ]; then
                RUBY_VERSION=$(grep -i "ruby" Gemfile | grep -oP '\d+\.\d+' | head -1)
                if [ -n "$RUBY_VERSION" ]; then
                  echo "  Ruby version from Gemfile: $RUBY_VERSION"
                fi
              fi
              
              # Install Ruby if needed
              if ! command -v ruby &> /dev/null || [ -n "$RUBY_VERSION" ]; then
                echo "  Installing Ruby..."
                if ! command -v rbenv &> /dev/null; then
                  git clone https://github.com/rbenv/rbenv.git ~/.rbenv
                  export PATH="$HOME/.rbenv/bin:$PATH"
                  eval "$(rbenv init -)"
                fi
                if [ -n "$RUBY_VERSION" ]; then
                  rbenv install -s "$RUBY_VERSION" || echo "  Warning: Could not install Ruby $RUBY_VERSION"
                  rbenv global "$RUBY_VERSION"
                fi
              fi
              
              # Install Bundler if needed
              if ! command -v bundle &> /dev/null; then
                gem install bundler || true
              fi
            fi
            
            # Detect Rust projects (Rust is not auto-installed; use a runner with Rust pre-installed for Rust/Cargo scanning)
            if [ -f Cargo.toml ] || [ -f Cargo.lock ]; then
              NEEDS_RUST=true
              echo "✓ Detected: Rust project"
            fi
            
            # Detect Swift projects
            if [ -f Package.swift ] || [ -f Podfile ] || [ -f Podfile.lock ]; then
              NEEDS_SWIFT=true
              echo "✓ Detected: Swift/Objective-C project"
              echo "  Note: Swift requires macOS runners, skipping installation on Linux"
            fi
            
            # Install project dependencies based on detected languages
            echo ""
            echo "Installing project dependencies for $branch..."
            
            if [ "$NEEDS_NODE" = true ]; then
              if [ -f yarn.lock ]; then
                yarn install --frozen-lockfile || yarn install || true
              elif [ -f pnpm-lock.yaml ]; then
                pnpm install --frozen-lockfile || pnpm install || true
              elif [ -f package-lock.json ]; then
                npm ci || npm install || true
              elif [ -f package.json ]; then
                npm install || true
              fi
            fi
            
            if [ "$NEEDS_JAVA" = true ]; then
              if [ -f gradlew ]; then
                ./gradlew dependencies --no-daemon || true
              elif [ -f pom.xml ]; then
                if ! command -v mvn &> /dev/null; then
                  echo "  Installing Maven..."
                  wget https://archive.apache.org/dist/maven/maven-3/3.9.5/binaries/apache-maven-3.9.5-bin.tar.gz
                  tar -xzf apache-maven-3.9.5-bin.tar.gz
                  export PATH="$PWD/apache-maven-3.9.5/bin:$PATH"
                fi
                mvn dependency:resolve || true
              elif [ -f build.sbt ]; then
                if ! command -v sbt &> /dev/null; then
                  echo "  Installing sbt..."
                  curl -s "https://raw.githubusercontent.com/sbt/sbt/1.x/sbt" > sbt
                  chmod +x sbt
                  export PATH="$PWD:$PATH"
                fi
                sbt update || true
              fi
            fi
            
            if [ "$NEEDS_PYTHON" = true ]; then
              if [ -f Pipfile ]; then
                pipenv install --dev || pipenv install || true
              elif [ -f poetry.lock ] || [ -f pyproject.toml ]; then
                poetry install || true
              elif [ -f requirements.txt ]; then
                pip install -r requirements.txt || true
              elif [ -f setup.py ]; then
                pip install -e . || true
              fi
            fi
            
            if [ "$NEEDS_DOTNET" = true ]; then
              dotnet restore || true
            fi
            
            if [ "$NEEDS_GO" = true ]; then
              go mod download || true
            fi
            
            if [ "$NEEDS_PHP" = true ]; then
              composer install --no-interaction || true
            fi
            
            if [ "$NEEDS_RUBY" = true ]; then
              bundle install || true
            fi
            
            if [ "$NEEDS_RUST" = true ]; then
              cargo fetch || true
            fi
            
            echo "Dependency detection and installation completed for $branch"
            echo ""
            
            # Set project name with repo and branch
            PROJECT_NAME="$REPO_NAME - $branch"
            
            # Function to create GitHub issues from Snyk JSON results
            create_issues_from_snyk_json() {
              local json_file="$1"
              local scan_type="$2"
              local scan_target="$3"
              
              if [ ! -f "$json_file" ] || [ ! -s "$json_file" ]; then
                echo "No JSON results file found or file is empty: $json_file"
                return 0
              fi
              
              # Validate JSON
              if ! jq empty "$json_file" 2>/dev/null; then
                echo "Invalid JSON in $json_file, checking if it contains errors..."
                head -20 "$json_file" || true
                return 0
              fi
              
              # Check if JSON is an array (from --all-projects) or single object
              local is_array=$(jq -r 'if type == "array" then "true" else "false" end' "$json_file" 2>/dev/null || echo "false")
              
              # Handle different JSON structures for different scan types
              if [ "$scan_type" = "code" ]; then
                # Snyk Code (SAST) structure
                local issues_count=0
                if [ "$is_array" = "true" ]; then
                  issues_count=$(jq '[.[] | .runs[0].results[]?] | length' "$json_file" 2>/dev/null || echo "0")
                else
                  issues_count=$(jq '[.runs[0].results[]?] | length' "$json_file" 2>/dev/null || echo "0")
                fi
                
                if [ "$issues_count" = "0" ] || [ "$issues_count" = "null" ]; then
                  echo "No SAST issues found in $scan_target"
                  return 0
                fi
                
                echo "Found $issues_count SAST issues. Creating GitHub issues..."
                if [ "$is_array" = "true" ]; then
                  jq -c '.[] | .runs[0].results[]?' "$json_file" 2>/dev/null | while IFS= read -r issue_json; do
                    if [ -n "$issue_json" ] && [ "$issue_json" != "null" ]; then
                      rule_id=$(echo "$issue_json" | jq -r '.ruleId // .rule.id // "unknown"' 2>/dev/null)
                      message=$(echo "$issue_json" | jq -r '.message.text // .message // "Security issue found"' 2>/dev/null | head -c 200)
                      severity=$(echo "$issue_json" | jq -r '.level // "medium"' 2>/dev/null)
                      locations=$(echo "$issue_json" | jq -r '.locations[0].physicalLocation.artifactLocation.uri // "unknown"' 2>/dev/null)
                      
                      issue_title="[SAST] $rule_id - $scan_target"
                      issue_body="## Snyk Code (SAST) Finding"$'\n'"**Scan Type:** SAST"$'\n'"**Target:** ${scan_target}"$'\n'"**Branch:** ${branch}"$'\n'"**Rule ID:** ${rule_id}"$'\n'"**Severity:** ${severity}"$'\n'"**Location:** ${locations}"$'\n'"**Message:** ${message}"$'\n'$'\n'"---"$'\n'"*This issue was automatically created by Snyk Security Scan workflow*"
                      
                      if gh issue create --title "$issue_title" --body "$issue_body" --label "security,snyk,sast" 2>&1; then
                        echo "✓ Created issue for SAST finding: $rule_id"
                      else
                        echo "✗ Failed to create issue for $rule_id"
                      fi
                    fi
                  done
                else
                  jq -c '.runs[0].results[]?' "$json_file" 2>/dev/null | while IFS= read -r issue_json; do
                    if [ -n "$issue_json" ] && [ "$issue_json" != "null" ]; then
                      rule_id=$(echo "$issue_json" | jq -r '.ruleId // .rule.id // "unknown"' 2>/dev/null)
                      message=$(echo "$issue_json" | jq -r '.message.text // .message // "Security issue found"' 2>/dev/null | head -c 200)
                      severity=$(echo "$issue_json" | jq -r '.level // "medium"' 2>/dev/null)
                      locations=$(echo "$issue_json" | jq -r '.locations[0].physicalLocation.artifactLocation.uri // "unknown"' 2>/dev/null)
                      
                      issue_title="[SAST] $rule_id - $scan_target"
                      issue_body="## Snyk Code (SAST) Finding"$'\n'"**Scan Type:** SAST"$'\n'"**Target:** ${scan_target}"$'\n'"**Branch:** ${branch}"$'\n'"**Rule ID:** ${rule_id}"$'\n'"**Severity:** ${severity}"$'\n'"**Location:** ${locations}"$'\n'"**Message:** ${message}"$'\n'$'\n'"---"$'\n'"*This issue was automatically created by Snyk Security Scan workflow*"
                      
                      if gh issue create --title "$issue_title" --body "$issue_body" --label "security,snyk,sast" 2>&1; then
                        echo "✓ Created issue for SAST finding: $rule_id"
                      else
                        echo "✗ Failed to create issue for $rule_id"
                      fi
                    fi
                  done
                fi
              else
                # SCA or Container scan structure
                local vuln_count=0
                if [ "$is_array" = "true" ]; then
                  # Array format from --all-projects: extract all vulnerabilities from all projects
                  vuln_count=$(jq '[.[] | .vulnerabilities[]?] | length' "$json_file" 2>/dev/null || echo "0")
                else
                  # Single object format
                  vuln_count=$(jq '[.vulnerabilities[]?] | length' "$json_file" 2>/dev/null || echo "0")
                fi
                
                if [ "$vuln_count" = "0" ] || [ "$vuln_count" = "null" ]; then
                  echo "No vulnerabilities found in $scan_target"
                  return 0
                fi
                
                echo "Found $vuln_count vulnerabilities. Creating GitHub issues..."
                if [ "$is_array" = "true" ]; then
                  # Extract all vulnerabilities from all projects in the array
                  jq -c '.[] | .vulnerabilities[]?' "$json_file" 2>/dev/null | while IFS= read -r vuln_json; do
                    if [ -n "$vuln_json" ] && [ "$vuln_json" != "null" ]; then
                      vuln_id=$(echo "$vuln_json" | jq -r '.id // .vulnerabilityId // "unknown"' 2>/dev/null)
                      title=$(echo "$vuln_json" | jq -r '.title // .name // "Vulnerability"' 2>/dev/null | head -c 200)
                      severity=$(echo "$vuln_json" | jq -r '.severity // "medium"' 2>/dev/null)
                      package=$(echo "$vuln_json" | jq -r '.packageName // .from[0] // "unknown"' 2>/dev/null)
                      version=$(echo "$vuln_json" | jq -r '.version // .from[1] // "unknown"' 2>/dev/null)
                      description=$(echo "$vuln_json" | jq -r '.description // .summary // "No description available"' 2>/dev/null | head -c 1000)
                      
                      issue_title="[${scan_type}] ${vuln_id} - ${package}@${version}"
                      issue_body="## Snyk ${scan_type} Finding"$'\n'"**Scan Type:** ${scan_type}"$'\n'"**Target:** ${scan_target}"$'\n'"**Branch:** ${branch}"$'\n'"**Vulnerability ID:** ${vuln_id}"$'\n'"**Package:** ${package}"$'\n'"**Version:** ${version}"$'\n'"**Severity:** ${severity}"$'\n'"**Description:** ${description}"$'\n'$'\n'"---"$'\n'"*This issue was automatically created by Snyk Security Scan workflow*"
                      
                      if gh issue create --title "$issue_title" --body "$issue_body" --label "security,snyk,${scan_type}" 2>&1; then
                        echo "✓ Created issue for ${scan_type} finding: $vuln_id"
                      else
                        echo "✗ Failed to create issue for $vuln_id"
                      fi
                    fi
                  done
                else
                  # Single object format
                  jq -c '.vulnerabilities[]?' "$json_file" 2>/dev/null | while IFS= read -r vuln_json; do
                    if [ -n "$vuln_json" ] && [ "$vuln_json" != "null" ]; then
                      vuln_id=$(echo "$vuln_json" | jq -r '.id // .vulnerabilityId // "unknown"' 2>/dev/null)
                      title=$(echo "$vuln_json" | jq -r '.title // .name // "Vulnerability"' 2>/dev/null | head -c 200)
                      severity=$(echo "$vuln_json" | jq -r '.severity // "medium"' 2>/dev/null)
                      package=$(echo "$vuln_json" | jq -r '.packageName // .from[0] // "unknown"' 2>/dev/null)
                      version=$(echo "$vuln_json" | jq -r '.version // .from[1] // "unknown"' 2>/dev/null)
                      description=$(echo "$vuln_json" | jq -r '.description // .summary // "No description available"' 2>/dev/null | head -c 1000)
                      
                      issue_title="[${scan_type}] ${vuln_id} - ${package}@${version}"
                      issue_body="## Snyk ${scan_type} Finding"$'\n'"**Scan Type:** ${scan_type}"$'\n'"**Target:** ${scan_target}"$'\n'"**Branch:** ${branch}"$'\n'"**Vulnerability ID:** ${vuln_id}"$'\n'"**Package:** ${package}"$'\n'"**Version:** ${version}"$'\n'"**Severity:** ${severity}"$'\n'"**Description:** ${description}"$'\n'$'\n'"---"$'\n'"*This issue was automatically created by Snyk Security Scan workflow*"
                      
                      if gh issue create --title "$issue_title" --body "$issue_body" --label "security,snyk,${scan_type}" 2>&1; then
                        echo "✓ Created issue for ${scan_type} finding: $vuln_id"
                      else
                        echo "✗ Failed to create issue for $vuln_id"
                      fi
                    fi
                  done
                fi
              fi
            }
            
            # ============================================
            # Snyk Security Scanning Section
            # ============================================
            
            # 1. Snyk Code (SAST)
            echo "Running Snyk Code (SAST) for $branch..."
            code_json_file="/tmp/snyk-code-$branch.json"
            snyk code test --json > "$code_json_file" 2>/tmp/snyk-code-errors.log || true
            
            # Create issues from SAST scan results
            create_issues_from_snyk_json "$code_json_file" "code" "$branch"
            
            # Also run with --report for Snyk UI
            snyk code test \
              --target-reference="$branch" \
              --project-tags="repo=$REPO_NAME,branch=$branch" \
              --report \
              --project-name="$PROJECT_NAME Code" || true
            
            # 2. Snyk Open Source (SCA) - All Projects
            echo "Running Snyk Open Source (SCA) for all projects in $branch..."
            sca_json_file="/tmp/snyk-sca-all-$branch.json"
            snyk test --all-projects --json > "$sca_json_file" 2>/tmp/snyk-sca-errors.log || true
            
            # Create issues from SCA scan results
            create_issues_from_snyk_json "$sca_json_file" "SCA" "$branch (all projects)"
            
            # Also run with --report for Snyk UI
            snyk test --all-projects \
              --target-reference="$branch" \
              --project-tags="repo=$REPO_NAME,branch=$branch" \
              --severity-threshold=low \
              --report || true
            
            snyk monitor --all-projects \
              --target-reference="$branch" \
              --project-tags="repo=$REPO_NAME,branch=$branch" || true
            
            # 3. Container scanning - Dockerfiles
            echo "Scanning Dockerfiles for $branch..."
            dockerfile_count=$(find . -name "Dockerfile*" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" | wc -l)
            
            if [ "$dockerfile_count" -gt 0 ]; then
              echo "Found $dockerfile_count Dockerfile(s). Processing..."
              
              find . -name "Dockerfile*" -type f ! -path "*/node_modules/*" ! -path "*/.git/*" | while read -r dockerfile; do
                echo "Processing Dockerfile: $dockerfile"
                dockerfile_dir=$(dirname "$dockerfile")
                dockerfile_name=$(basename "$dockerfile")
                
                # Try to build the Dockerfile into an image
                image_name=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
                if [ -z "$image_name" ]; then
                  image_name="snyk-test-image"
                fi
                
                echo "Step 1: Attempting to build image: $image_name:latest from $dockerfile..."
                build_success=false
                if docker build -t "$image_name:latest" -f "$dockerfile" "$dockerfile_dir" 2>&1; then
                  echo "Successfully built image: $image_name:latest"
                  build_success=true
                  
                  # Scan the built container image
                  echo "Step 2: Running Snyk container test on built image..."
                  container_json_file="/tmp/snyk-container-$image_name-$dockerfile_name.json"
                  snyk container test "$image_name:latest" \
                    --file="$dockerfile" \
                    --json > "$container_json_file" 2>/tmp/snyk-container-$image_name-errors.log || true
                  
                  # Create issues from container scan results
                  create_issues_from_snyk_json "$container_json_file" "container" "$image_name:latest ($dockerfile)"
                  
                  # Still run with report for Snyk UI
                  snyk container test "$image_name:latest" \
                    --file="$dockerfile" \
                    --target-reference="$branch" \
                    --project-tags="repo=$REPO_NAME,branch=$branch" \
                    --severity-threshold=low \
                    --report \
                    --project-name="$PROJECT_NAME Container Image - $dockerfile" || {
                    echo "Warning: Snyk container test on built image failed."
                  }
                  
                  # Monitor the container image
                  echo "Step 3: Running Snyk container monitor on built image..."
                  snyk container monitor "$image_name:latest" \
                    --file="$dockerfile" \
                    --target-reference="$branch" \
                    --project-tags="repo=$REPO_NAME,branch=$branch" \
                    --project-name="$PROJECT_NAME Container Image - $dockerfile" || {
                    echo "Warning: Snyk container monitor on built image failed."
                  }
                else
                  echo "Warning: Could not build image from $dockerfile."
                  echo "Attempting to extract and scan base image from Dockerfile..."
                  
                  # Extract base image from Dockerfile
                  base_image=$(grep -i "^FROM" "$dockerfile" | head -1 | awk '{print $2}' | cut -d'@' -f1 | cut -d':' -f1-2)
                  
                  if [ -n "$base_image" ] && [ "$base_image" != "FROM" ]; then
                    echo "Found base image: $base_image"
                    
                    # Try to pull the base image
                    echo "Step 2: Attempting to pull base image: $base_image..."
                    if docker pull "$base_image" 2>&1; then
                      echo "Successfully pulled base image: $base_image"
                      
                      # Verify image exists locally
                      if docker image inspect "$base_image" >/dev/null 2>&1; then
                        echo "Step 3: Scanning base image for vulnerabilities..."
                        
                        # Scan the base image
                        base_container_json_file="/tmp/snyk-container-base-$base_image-$dockerfile_name.json"
                        snyk container test "$base_image" \
                          --file="$dockerfile" \
                          --json > "$base_container_json_file" 2>/tmp/snyk-container-base-$base_image-errors.log || true
                        
                        # Create issues from base image scan results
                        create_issues_from_snyk_json "$base_container_json_file" "container" "$base_image (base for $dockerfile)"
                        
                        # Still run with report for Snyk UI
                        snyk container test "$base_image" \
                          --file="$dockerfile" \
                          --target-reference="$branch" \
                          --project-tags="repo=$REPO_NAME,branch=$branch" \
                          --severity-threshold=low \
                          --report \
                          --project-name="$PROJECT_NAME Container Base - $dockerfile" || {
                          echo "Warning: Snyk container test on base image failed."
                        }
                        
                        # Monitor the base image
                        echo "Step 4: Running Snyk container monitor on base image..."
                        snyk container monitor "$base_image" \
                          --file="$dockerfile" \
                          --target-reference="$branch" \
                          --project-tags="repo=$REPO_NAME,branch=$branch" \
                          --project-name="$PROJECT_NAME Container Base - $dockerfile" || {
                          echo "Warning: Snyk container monitor on base image failed."
                        }
                      else
                        echo "Warning: Base image $base_image could not be verified locally. Skipping scan."
                      fi
                    else
                      echo "Warning: Could not pull base image: $base_image"
                      echo "The image may not exist, be deprecated, or require authentication."
                    fi
                  else
                    echo "Could not extract base image from Dockerfile. Skipping base image scan."
                  fi
                fi
                
                echo "Completed scanning Dockerfile: $dockerfile"
                echo ""
              done
              
              echo "Completed scanning all $dockerfile_count Dockerfile(s)."
            fi
            echo ""
            
            echo "Completed scanning branch: $branch"
            echo ""
          done
